<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>street — the shop that becomes a website</title>
  </head>
  <body>
    <template id="street-template">
      <style>
        @font-face {
          font-family: "Archivo";
          src: url("../assets/fonts/Archivo-Variable.woff2") format("woff2");
          font-weight: 100 900;
          font-stretch: 62% 125%;
        }
        @font-face {
          font-family: "JetBrains Mono";
          src: url("../assets/fonts/JetBrainsMono-Variable.woff2") format("woff2");
          font-weight: 100 800;
        }

        #st-root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          font-family: "Archivo", sans-serif;
          --split: 600px;
        }
        #st-root .st-abs {
          position: absolute;
          display: block;
        }

        /* ---------- glow behind the website card ---------- */
        #st-webglow {
          left: 0;
          top: 0;
          width: 1080px;
          height: 1920px;
          opacity: 0;
          pointer-events: none;
        }
        #st-webglow-halo {
          left: 40px;
          top: 520px;
          width: 1000px;
          height: 1180px;
          border-radius: 50%;
          background: radial-gradient(closest-side, rgba(255, 214, 160, 0.55), rgba(255, 190, 120, 0.18) 60%, rgba(255, 190, 120, 0) 100%);
          filter: blur(30px);
        }
        #st-webglow-pool {
          left: 60px;
          top: 1530px;
          width: 960px;
          height: 160px;
          border-radius: 50%;
          background: radial-gradient(closest-side, rgba(255, 228, 190, 0.6), rgba(255, 210, 160, 0) 100%);
          filter: blur(10px);
        }

        /* ---------- world (camera) ---------- */
        #st-world {
          left: 0;
          top: 0;
          width: 1080px;
          height: 1920px;
          transform-origin: 540px 1100px;
        }
        #st-shop,
        #st-web {
          left: 0;
          top: 0;
          width: 1080px;
          height: 1920px;
        }
        #st-shop {
          clip-path: inset(var(--split) 0px 0px 0px);
        }
        #st-web {
          clip-path: inset(0px 0px calc(1920px - var(--split)) 0px);
        }

        /* ---------- the physical shop ---------- */
        #st-contact {
          left: 110px;
          top: 1540px;
          width: 860px;
          height: 60px;
          border-radius: 50%;
          background: radial-gradient(closest-side, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0));
        }
        #st-spill {
          left: 120px;
          top: 1548px;
          width: 840px;
          height: 150px;
          border-radius: 50%;
          background: radial-gradient(closest-side, rgba(255, 196, 110, 0.55), rgba(255, 170, 80, 0) 100%);
          filter: blur(6px);
        }
        #st-facade {
          left: 140px;
          top: 640px;
          width: 800px;
          height: 920px;
          background-color: #6b4a3c;
          background-image: repeating-linear-gradient(0deg, rgba(30, 18, 14, 0.16) 0 3px, transparent 3px 36px),
            linear-gradient(90deg, rgba(0, 0, 0, 0.18), rgba(0, 0, 0, 0) 12%, rgba(0, 0, 0, 0) 88%, rgba(0, 0, 0, 0.22));
        }
        #st-pilaster-l,
        #st-pilaster-r {
          top: 700px;
          width: 30px;
          height: 860px;
          background: #5a3d31;
        }
        #st-pilaster-l {
          left: 140px;
        }
        #st-pilaster-r {
          left: 910px;
        }
        #st-cornice {
          left: 124px;
          top: 624px;
          width: 832px;
          height: 76px;
          background: linear-gradient(180deg, #7a5646 0 14px, #4e352b 14px 62px, #3e2a22 62px 76px);
          border-radius: 4px;
        }
        #st-fascia {
          left: 176px;
          top: 708px;
          width: 728px;
          height: 78px;
          background: #2b201c;
          border-radius: 6px;
          box-shadow: inset 0 0 0 4px #3d2d26;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #st-fascia-text {
          font-weight: 800;
          font-stretch: 112%;
          font-size: 50px;
          letter-spacing: 0.06em;
          color: #f3d9a4;
          text-shadow: 0 0 18px rgba(255, 190, 100, 0.65);
          line-height: 1;
          white-space: nowrap;
        }
        #st-awning {
          left: 160px;
          top: 790px;
          width: 760px;
          height: 92px;
        }
        #st-awning-stripes {
          left: 0;
          top: 0;
          width: 760px;
          height: 70px;
          background: linear-gradient(180deg, rgba(0, 0, 0, 0.18), rgba(0, 0, 0, 0) 40%),
            repeating-linear-gradient(90deg, #efe3cf 0 47.5px, #a8643e 47.5px 95px);
          border-radius: 6px 6px 0 0;
        }
        #st-awning-scallop {
          left: 0;
          top: 70px;
          width: 760px;
          height: 22px;
          background: radial-gradient(circle at 23.75px 0, #efe3cf 22px, transparent 23px) 0 0 / 95px 22px repeat-x,
            radial-gradient(circle at 23.75px 0, #a8643e 22px, transparent 23px) 47.5px 0 / 95px 22px repeat-x;
        }
        #st-awning-shadow {
          left: 170px;
          top: 872px;
          width: 740px;
          height: 40px;
          background: linear-gradient(180deg, rgba(20, 10, 6, 0.45), rgba(20, 10, 6, 0));
        }

        /* window */
        #st-window {
          left: 190px;
          top: 900px;
          width: 420px;
          height: 420px;
          border-radius: 6px;
          overflow: hidden;
          background: radial-gradient(120% 90% at 50% 35%, #ffd896 0%, #f1a85b 55%, #c9773c 100%);
          box-shadow: 0 0 0 14px #4e352b, 0 0 0 18px #3a2820;
        }
        #st-window-glass {
          left: 0;
          top: 0;
          width: 420px;
          height: 420px;
          background: linear-gradient(115deg, rgba(255, 255, 255, 0) 30%, rgba(255, 255, 255, 0.16) 38%, rgba(255, 255, 255, 0) 46%),
            linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0));
        }
        #st-window-dark {
          left: 0;
          top: 0;
          width: 420px;
          height: 420px;
          background: linear-gradient(115deg, rgba(16, 22, 42, 0.9) 30%, rgba(60, 74, 110, 0.86) 38%, rgba(16, 22, 42, 0.92) 46%), #10162a;
          opacity: 0;
        }
        #st-sill {
          left: 172px;
          top: 1334px;
          width: 456px;
          height: 20px;
          background: #7d5847;
          border-radius: 3px;
        }
        #st-riser {
          left: 190px;
          top: 1366px;
          width: 420px;
          height: 180px;
          background: #4e352b;
          border-radius: 4px;
          box-shadow: inset 0 0 0 16px #5a3d31, inset 0 0 0 20px #3e2a22;
        }

        /* goods (shared by shop window and website hero) */
        .st-goods {
          left: 0;
          top: 0;
          width: 420px;
          height: 420px;
        }
        .st-goods .st-g {
          position: absolute;
          display: block;
        }
        .st-shelf {
          position: absolute;
          left: 0;
          width: 420px;
          height: 12px;
          background: #7a4a2c;
          box-shadow: 0 8px 14px rgba(70, 30, 10, 0.35);
        }

        /* door */
        #st-door {
          left: 660px;
          top: 900px;
          width: 230px;
          height: 660px;
          background: #3c2a24;
          border-radius: 6px 6px 0 0;
          box-shadow: 0 0 0 12px #4e352b, 0 0 0 16px #3a2820;
        }
        #st-door-glass {
          left: 684px;
          top: 930px;
          width: 182px;
          height: 300px;
          border-radius: 4px;
          background: radial-gradient(120% 90% at 50% 30%, #ffd896, #e89a52 70%, #c27238);
          overflow: hidden;
        }
        #st-door-glass-dark {
          left: 0;
          top: 0;
          width: 182px;
          height: 300px;
          background: linear-gradient(115deg, #10162a 30%, #34405e 40%, #10162a 50%);
          opacity: 0;
        }
        #st-door-panel {
          left: 684px;
          top: 1262px;
          width: 182px;
          height: 250px;
          border-radius: 4px;
          box-shadow: inset 0 0 0 6px #33231e;
        }
        #st-door-handle {
          left: 842px;
          top: 1220px;
          width: 12px;
          height: 64px;
          border-radius: 6px;
          background: #d8b47a;
        }
        #st-step {
          left: 640px;
          top: 1556px;
          width: 270px;
          height: 16px;
          background: #8a6a58;
          border-radius: 2px;
        }

        /* hanging OPEN/CLOSED sign */
        #st-sign-nail {
          left: 770px;
          top: 952px;
          width: 10px;
          height: 10px;
          border-radius: 50%;
          background: #d8b47a;
        }
        #st-sign-hang {
          left: 685px;
          top: 957px;
          width: 180px;
          height: 120px;
          transform-origin: 90px 0px;
        }
        #st-sign-string {
          left: 0;
          top: 0;
          width: 160px;
          height: 40px;
        }
        #st-sign-card {
          left: 10px;
          top: 34px;
          width: 160px;
          height: 80px;
          transform-style: preserve-3d;
        }
        .st-sign-face {
          position: absolute;
          left: 0;
          top: 0;
          width: 160px;
          height: 80px;
          border-radius: 10px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-weight: 800;
          font-stretch: 100%;
          letter-spacing: 0.04em;
          backface-visibility: hidden;
          -webkit-backface-visibility: hidden;
          box-shadow: 0 6px 12px rgba(0, 0, 0, 0.35);
        }
        #st-sign-open {
          background: #f6efe3;
          color: #14161f;
          font-size: 36px;
        }
        #st-sign-closed {
          background: #f6efe3;
          color: #14161f;
          font-size: 30px;
          transform: rotateY(180deg);
        }

        /* lamp */
        #st-lamp {
          left: 624px;
          top: 860px;
          width: 22px;
          height: 34px;
          border-radius: 6px 6px 10px 10px;
          background: #2a1f1a;
        }
        #st-lamp-bulb {
          left: 627px;
          top: 884px;
          width: 16px;
          height: 16px;
          border-radius: 50%;
          background: #ffe2a8;
        }
        #st-lamp-glow {
          left: 535px;
          top: 792px;
          width: 200px;
          height: 200px;
          border-radius: 50%;
          background: radial-gradient(closest-side, rgba(255, 210, 130, 0.75), rgba(255, 190, 100, 0) 100%);
        }
        #st-shop-shade {
          left: 124px;
          top: 624px;
          width: 832px;
          height: 950px;
          background: #0b0e18;
          opacity: 0;
        }
        #st-moonlight {
          left: 124px;
          top: 624px;
          width: 832px;
          height: 950px;
          background: linear-gradient(200deg, rgba(150, 170, 220, 0.16), rgba(150, 170, 220, 0) 55%);
          opacity: 0;
        }

        /* ---------- the website (same geometry) ---------- */
        #st-w-card {
          left: 140px;
          top: 640px;
          width: 800px;
          height: 920px;
          border-radius: 28px;
          background: #f6efe3;
          overflow: hidden;
          box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.5), 0 30px 90px rgba(255, 180, 110, 0.28);
        }
        #st-w-content {
          left: 0;
          top: 0;
          width: 800px;
          height: 920px;
        }
        #st-w-bar {
          left: 0;
          top: 0;
          width: 800px;
          height: 64px;
          background: #ebe2d3;
        }
        .st-w-dot {
          position: absolute;
          top: 24px;
          width: 16px;
          height: 16px;
          border-radius: 50%;
          background: #c9bda9;
        }
        #st-w-url {
          left: 150px;
          top: 14px;
          width: 500px;
          height: 36px;
          border-radius: 18px;
          background: #f9f4ec;
        }
        #st-w-lock {
          left: 170px;
          top: 24px;
          width: 14px;
          height: 16px;
          border-radius: 3px;
          background: #8f8576;
        }
        #st-w-urlbar {
          left: 196px;
          top: 28px;
          width: 220px;
          height: 8px;
          border-radius: 4px;
          background: #d8cfc0;
        }
        #st-w-nav {
          left: 0;
          top: 64px;
          width: 800px;
          height: 88px;
          border-bottom: 2px solid #e4dacb;
        }
        #st-w-logo {
          left: 40px;
          top: 24px;
          font-weight: 800;
          font-stretch: 125%;
          font-size: 36px;
          letter-spacing: -0.01em;
          color: #14161f;
          line-height: 1.1;
          white-space: nowrap;
        }
        .st-w-burger {
          position: absolute;
          left: 718px;
          width: 42px;
          height: 5px;
          border-radius: 3px;
          background: #14161f;
        }
        #st-w-chips {
          left: 40px;
          top: 170px;
          width: 720px;
          height: 44px;
          display: flex;
          gap: 14px;
        }
        .st-w-chip {
          display: block;
          height: 44px;
          padding: 0 22px;
          border-radius: 22px;
          border: 2px solid #c9bda9;
          font-weight: 600;
          font-size: 26px;
          line-height: 40px;
          color: #3a3742;
          white-space: nowrap;
        }
        #st-w-hero {
          left: 50px;
          top: 260px;
          width: 420px;
          height: 420px;
          border-radius: 22px;
          overflow: hidden;
          background: radial-gradient(120% 100% at 40% 30%, #fbe3c8, #f0c39c 70%, #e7ad84);
        }
        #st-w-hero-zoom {
          left: 0;
          top: 0;
          width: 420px;
          height: 420px;
          transform-origin: 210px 240px;
        }
        #st-w-hero-tag {
          left: 18px;
          top: 18px;
          height: 44px;
          padding: 0 20px;
          border-radius: 22px;
          background: #e8431a;
          color: #fff7ee;
          font-weight: 700;
          font-size: 26px;
          line-height: 44px;
          white-space: nowrap;
        }
        #st-w-badge {
          left: 528px;
          top: 360px;
          width: 214px;
          height: 60px;
          border-radius: 30px;
          background: #14161f;
          color: #f6efe3;
          font-weight: 800;
          font-stretch: 100%;
          font-size: 26px;
          letter-spacing: 0.03em;
          line-height: 60px;
          padding-left: 50px;
          white-space: nowrap;
        }
        #st-w-badge-dot {
          left: 22px;
          top: 20px;
          width: 20px;
          height: 20px;
          border-radius: 50%;
          background: #ff4a1c;
          box-shadow: 0 0 12px rgba(255, 74, 28, 0.8);
        }
        .st-w-btn {
          position: absolute;
          left: 528px;
          width: 214px;
          height: 90px;
          border-radius: 45px;
          font-weight: 800;
          font-stretch: 112%;
          font-size: 30px;
          line-height: 90px;
          text-align: center;
          white-space: nowrap;
        }
        #st-w-book {
          top: 480px;
          background: #e8431a;
          color: #fff7ee;
          box-shadow: 0 14px 30px rgba(255, 74, 28, 0.35);
        }
        #st-w-call {
          top: 600px;
          border: 3px solid #14161f;
          color: #14161f;
          line-height: 84px;
        }
        #st-w-find {
          top: 720px;
          border: 3px solid #14161f;
          color: #14161f;
          line-height: 84px;
        }
        #st-w-map {
          left: 50px;
          top: 710px;
          width: 420px;
          height: 180px;
          border-radius: 22px;
          overflow: hidden;
          background: #e3e7dc;
        }
        .st-w-road {
          position: absolute;
          background: #fbfaf6;
        }
        #st-w-pin {
          left: 228px;
          top: 44px;
          width: 44px;
          height: 60px;
          transform-origin: 22px 58px;
        }
        #st-w-pin-shadow {
          left: 236px;
          top: 96px;
          width: 28px;
          height: 10px;
          border-radius: 50%;
          background: rgba(0, 0, 0, 0.18);
        }
        #st-w-ripple {
          left: 668px;
          top: 1120px;
          width: 214px;
          height: 90px;
          border-radius: 45px;
          border: 4px solid #ff4a1c;
          opacity: 0;
        }

        /* ---------- the line ---------- */
        #st-line {
          left: 100px;
          top: 0;
          width: 880px;
          height: 6px;
          opacity: 0;
          transform-origin: 440px 3px;
        }
        #st-line-glow {
          left: -40px;
          top: -38px;
          width: 960px;
          height: 82px;
          border-radius: 50%;
          background: radial-gradient(closest-side, rgba(255, 74, 28, 0.7), rgba(255, 74, 28, 0) 100%);
        }
        #st-line-core {
          left: 0;
          top: 0;
          width: 880px;
          height: 6px;
          border-radius: 3px;
          background: linear-gradient(90deg, rgba(255, 74, 28, 0), #ff4a1c 6%, #ffd2b8 50%, #ff4a1c 94%, rgba(255, 74, 28, 0));
          box-shadow: 0 0 14px 3px rgba(255, 74, 28, 0.85);
        }

        /* ---------- search bubbles ---------- */
        .st-bubble {
          position: absolute;
          display: block;
          height: 64px;
          padding: 0 26px 0 50px;
          border-radius: 32px;
          background: rgba(28, 34, 54, 0.94);
          box-shadow: 0 0 0 2px rgba(246, 239, 227, 0.12), 0 14px 30px rgba(0, 0, 0, 0.35);
          color: #f6efe3;
          font-weight: 600;
          font-stretch: 100%;
          font-size: 30px;
          line-height: 64px;
          white-space: nowrap;
          opacity: 0;
        }
        .st-bubble .st-bdot {
          position: absolute;
          left: 20px;
          top: 24px;
          width: 16px;
          height: 16px;
          border-radius: 50%;
          background: #ffb547;
          box-shadow: 0 0 12px rgba(255, 181, 71, 0.9);
        }
        .st-bwrap {
          position: absolute;
          left: 0;
          width: 1080px;
          height: 64px;
          display: flex;
          justify-content: center;
        }
        #st-lone {
          left: 735px;
          top: 1190px;
          width: 80px;
          height: 80px;
          border-radius: 50%;
          border: 3px solid rgba(255, 181, 71, 0.9);
          opacity: 0;
        }

        /* ---------- customer pings flying in ---------- */
        .st-ping {
          position: absolute;
          left: 0;
          top: 0;
          width: 26px;
          height: 26px;
          margin: -13px 0 0 -13px;
          border-radius: 50%;
          background: #ffb547;
          box-shadow: 0 0 18px 6px rgba(255, 181, 71, 0.7);
          opacity: 0;
        }
        .st-trail {
          position: absolute;
          left: 0;
          top: 0;
          width: 14px;
          height: 14px;
          margin: -7px 0 0 -7px;
          border-radius: 50%;
          background: #ffcf85;
          opacity: 0;
        }

        /* ---------- notifications ---------- */
        .st-note {
          position: absolute;
          display: block;
          left: 230px;
          width: 620px;
          height: 100px;
          border-radius: 26px;
          background: #fffbf4;

          opacity: 0;
        }
        .st-note-icon {
          position: absolute;

          height: 56px;
          border-radius: 16px;
          background: #ff4a1c;
        }
        .st-note-icon svg {
          position: absolute;
          left: 12px;
          top: 12px;
          width: 32px;
          height: 32px;
        }
        .st-note-label {
          position: absolute;
          left: 100px;
          top: 0;

          font-size: 34px;
          line-height: 100px;
          color: #14161f;
          white-space: nowrap;
        }
        .st-note-time {
          position: absolute;
          right: 28px;
          top: 0;
          font-family: "JetBrains Mono", monospace;
          font-weight: 500;
          font-size: 28px;
          line-height: 100px;
          color: #5e5a66;
        }

        /* ---------- headlines + clock ---------- */
        #st-hl {
          left: 96px;
          top: 300px;
          width: 888px;
          height: 230px;
        }
        .st-hblock {
          position: absolute;
          left: 0;
          top: 0;
          width: 888px;
        }
        .st-mask {
          display: block;
          height: 112px;
          overflow: hidden;
        }
        .st-lin {
          display: block;
          font-weight: 800;
          font-stretch: 112%;

          line-height: 108px;
          letter-spacing: -0.025em;
          color: #f6efe3;
          white-space: nowrap;
        }
        .st-amber {
          color: #ffb547;
        }
        .st-verm {
          color: #ff5a2e;
        }
        #st-clock {
          left: 96px;
          top: 206px;
          height: 48px;
          width: 300px;
        }
        #st-clock-icon {
          left: 0;
          top: 10px;
          width: 28px;
          height: 28px;
        }
        #st-clock-sun,
        #st-clock-moon {
          left: 0;
          top: 0;
          width: 28px;
          height: 28px;
          border-radius: 50%;
        }
        #st-clock-sun {
          background: #ffb547;
          box-shadow: 0 0 12px rgba(255, 181, 71, 0.8);
        }
        #st-clock-moon {
          background: radial-gradient(circle at 70% 35%, rgba(0, 0, 0, 0) 9px, #f6efe3 10px);
          opacity: 0;
        }
        #st-clock-text {
          left: 44px;
          top: 0;
          font-family: "JetBrains Mono", monospace;
          font-weight: 500;
          font-size: 34px;
          line-height: 48px;
          letter-spacing: 0.04em;
          color: #f6efe3;

      <script>
        (function () {
          var S = window.SYRAZEN;
          var K = window.SYRAZEN_KIT;
          var C = S.cues;
          var G = S.geometry;
          var COPY = S.copy;
          var $ = function (id) {
            return document.getElementById(id);
          };
          var stage = $("st-root");

          /* ---------------- build: goods (same geometry in the shop window and the website hero) */
          var GOODS = [
            // shelf 1 (bottom y 175)
            { x: 30, y: 89, w: 62, h: 86, r: "14px 14px 10px 10px", c: "#b5704f" },
            { x: 26, y: 78, w: 70, h: 16, r: "6px", c: "#efe3cf" },
            { x: 106, y: 65, w: 54, h: 110, r: "12px", c: "#7c8a5c" },
            { x: 112, y: 56, w: 42, h: 14, r: "5px", c: "#efe3cf" },
            { x: 178, y: 125, w: 64, h: 50, r: "6px 6px 14px 14px", c: "#a8643e" },
            { x: 168, y: 62, w: 52, h: 52, r: "50%", c: "#7c8a5c" },
            { x: 200, y: 50, w: 50, h: 50, r: "50%", c: "#8e9c6a" },
            { x: 184, y: 92, w: 56, h: 40, r: "50%", c: "#6d7a50" },
            { x: 266, y: 119, w: 74, h: 56, r: "6px", c: "#efe3cf" },
            { x: 276, y: 77, w: 54, h: 44, r: "6px", c: "#d9a441" },
            { x: 356, y: 55, w: 36, h: 120, r: "14px 14px 6px 6px", c: "#d9a441" },
            { x: 364, y: 40, w: 20, h: 20, r: "4px", c: "#8a5a3c" },
            // shelf 2 (bottom y 345)
            { x: 40, y: 270, w: 116, h: 70, r: "58px 58px 6px 6px", c: "#efe3cf" },
            { x: 92, y: 255, w: 12, h: 18, r: "6px", c: "#efe3cf" },
            { x: 70, y: 338, w: 56, h: 8, r: "3px", c: "#8a5a3c" },
            { x: 176, y: 291, w: 96, h: 54, r: "48px 48px 12px 12px", c: "#c98b7a" },
            { x: 192, y: 300, w: 64, h: 8, r: "4px", c: "#e7b3a2" },
            { x: 290, y: 301, w: 30, h: 44, r: "8px", c: "#b5704f" },
            { x: 326, y: 301, w: 30, h: 44, r: "8px", c: "#7c8a5c" },
            { x: 362, y: 301, w: 30, h: 44, r: "8px", c: "#d9a441" },
          ];
          function buildGoods(host, withShelves) {
            if (withShelves) {
              [175, 345].forEach(function (y) {
                var s = document.createElement("span");
                s.className = "st-shelf";
                s.style.top = y + "px";
                host.appendChild(s);
              });
            }
            GOODS.forEach(function (g) {
              var el = document.createElement("span");
              el.className = "st-g";
              el.style.left = g.x + "px";
              el.style.top = g.y + "px";
              el.style.width = g.w + "px";
              el.style.height = g.h + "px";
              el.style.borderRadius = g.r;
              el.style.background = g.c;
              host.appendChild(el);
            });
          }
          buildGoods($("st-goods-shop"), true);
          buildGoods($("st-goods-web"), false);

          /* ---------------- build: headlines */
          var HL = {};
          var HLB = {};
          function buildHeadline(key, lines, accents) {
            var block = document.createElement("div");
            block.className = "st-hblock";
            block.id = "st-" + key;
            block.style.visibility = "hidden";
            HLB[key] = block;
            var inners = [];
            lines.forEach(function (text, i) {
              var mask = document.createElement("span");
              mask.className = "st-mask";
              var inner = document.createElement("span");
              inner.className = "st-lin";
              inner.setAttribute("data-layout-allow-overflow", "");
              var acc = accents && accents[i];
              if (acc) {
                var idx = text.indexOf(acc.word);
                inner.appendChild(document.createTextNode(text.slice(0, idx)));
                var sp = document.createElement("span");
                sp.className = acc.cls;
                sp.textContent = acc.word;
                inner.appendChild(sp);
                inner.appendChild(document.createTextNode(text.slice(idx + acc.word.length)));
              } else {
                inner.textContent = text;
              }
              mask.appendChild(inner);
              block.appendChild(mask);
              inners.push(inner);
            });
            $("st-hl").appendChild(block);
            HL[key] = inners;
          }
          buildHeadline("h1", COPY.headline1, [null, { word: "6.", cls: "st-amber" }]);
          buildHeadline("h2", COPY.headline2);
          buildHeadline("h3", COPY.headline3);
          buildHeadline("h4", COPY.headline4, [null, { word: "open.", cls: "st-verm" }]);
          buildHeadline("h5", COPY.headline5, [null, { word: "new customers.", cls: "st-amber" }]);

          /* ---------------- build: search bubbles near each searcher's glow */
          var BUBBLE_POS = {
            s1: { left: 96, top: 676 },
            s2: { right: 96, top: 756 },
            s3: { left: 96, top: 1104 },
            s4: { right: 96, top: 1186 },
            s5: { center: 540, top: 1566 },
          };
          var bubbles = G.searchers.map(function (s) {
            var b = document.createElement("div");
            b.className = "st-bubble";
            b.id = "st-bubble-" + s.id;
            var dot = document.createElement("span");
            dot.className = "st-bdot";
            b.appendChild(dot);
            b.appendChild(document.createTextNode(s.label));
            var p = BUBBLE_POS[s.id];
            if (p.center !== undefined) {
              var wrap = document.createElement("div");
              wrap.className = "st-bwrap";
              wrap.style.top = p.top + "px";
              b.style.position = "relative";
              wrap.appendChild(b);
              $("st-bubbles").appendChild(wrap);
            } else {
              b.style.top = p.top + "px";
              if (p.left !== undefined) b.style.left = p.left + "px";
              if (p.right !== undefined) b.style.right = p.right + "px";
              $("st-bubbles").appendChild(b);
            }
            return { el: b, s: s };
          });

          /* ---------------- build: customer pings (dot + trail) */
          var PING_FROM = ["s1", "s2", "s3", "s4"];
          var TRAIL = 7;
          var pings = PING_FROM.map(function (sid, i) {
            var s = G.searchers.filter(function (q) {
              return q.id === sid;
            })[0];
            var trail = [];
            for (var k = 0; k < TRAIL; k++) {
              var t = document.createElement("span");
              t.className = "st-trail";
              $("st-pings").appendChild(t);
              trail.push(t);
            }
            var d = document.createElement("span");
            d.className = "st-ping";
            d.id = "st-ping-" + i;
            $("st-pings").appendChild(d);
            var bx = G.bookButton.cx,
              by = G.bookButton.cy;
            var cx = (s.x + bx) / 2 + (s.x < 540 ? -60 : 60);
            var cy = Math.min(s.y, by) - 260;
            return { dot: d, trail: trail, p0: [s.x, s.y], p1: [cx, cy], p2: [bx, by] };
          });
          function bez(p, t) {
            var u = 1 - t;
            return [
              u * u * p.p0[0] + 2 * u * t * p.p1[0] + t * t * p.p2[0],
              u * u * p.p0[1] + 2 * u * t * p.p1[1] + t * t * p.p2[1],
            ];
          }

          /* ---------------- build: notifications */
          var ICONS = [
            '<svg viewBox="0 0 32 32"><rect x="5" y="7" width="22" height="20" rx="4" fill="none" stroke="#fff7ee" stroke-width="3"/><path d="M5 13h22M11 4v6M21 4v6" stroke="#fff7ee" stroke-width="3" stroke-linecap="round"/></svg>',
            '<svg viewBox="0 0 32 32"><path d="M7 11h18l-2 16H9z" fill="none" stroke="#fff7ee" stroke-width="3" stroke-linejoin="round"/><path d="M12 11a4 4 0 0 1 8 0" fill="none" stroke="#fff7ee" stroke-width="3"/></svg>',
            '<svg viewBox="0 0 32 32"><path d="M5 8h22v14H13l-6 5v-5H5z" fill="none" stroke="#fff7ee" stroke-width="3" stroke-linejoin="round"/></svg>',
            '<svg viewBox="0 0 32 32"><rect x="4" y="8" width="24" height="17" rx="3" fill="none" stroke="#fff7ee" stroke-width="3"/><path d="M5 10l11 8 11-8" fill="none" stroke="#fff7ee" stroke-width="3" stroke-linejoin="round"/></svg>',
          ];
          var NOTE_TOP0 = 724,
            NOTE_STEP = 116;
          var notes = COPY.notifications.map(function (n, i) {
            var el = document.createElement("div");
            el.className = "st-note";
            el.id = "st-note-" + i;
            el.style.top = NOTE_TOP0 + i * NOTE_STEP + "px";
            el.innerHTML =
              '<span class="st-note-icon">' +
              ICONS[i] +
              '</span><span class="st-note-label"></span><span class="st-note-time"></span>';
            el.querySelector(".st-note-label").textContent = n.label;
            el.querySelector(".st-note-time").textContent = n.time;
            $("st-notes").appendChild(el);
            return el;
          });

          /* ================= timeline ================= */
          var tl = gsap.timeline({ paused: true });
          var cue = function (n, i) {
            return K.cue(n, i, 0);
          };

          /* --- the split line: --split and the line position are one pure function of time (seam can never drift) */
          var lineEl = $("st-line");
          var L0 = cue("lineDrop", 0),
            L1 = cue("lineDrop", 1);
          var splitEase = gsap.parseEase("power2.inOut");
          var lastSplit = -1;
          function splitAt(t) {
            if (t < L0) return 600;
            if (t < L1) return 600 + 1000 * splitEase((t - L0) / (L1 - L0));
            if (t < L1 + 0.05) return 1600;
            return 1920;
          }
          function applySplit(t) {
            var y = Math.round(splitAt(t));
            if (y === lastSplit) return;
            lastSplit = y;
            stage.style.setProperty("--split", y + "px");
            gsap.set(lineEl, { y: Math.min(y, 1600) - 3 });
          }
          applySplit(0);
          /* --- master driver: clock text + line split + ping positions are pure functions of time */
          var CLOCK = [
            [0, "17:59"],
            [cue("clockTick"), "18:00"],
            [cue("clock2100"), "21:00"],
            [cue("clock2330"), "23:30"],
            [cue("clock0214"), "02:14"],
            [cue("clock0447"), "04:47"],
            [cue("clock0630"), "06:30"],
          ];
          var clockEl = $("st-clock-text");
          var lastClock = "";
          var drive = { t: 0 };
          tl.fromTo(
            drive,
            { t: 0 },
            {
              t: 12,
              duration: 12,
              ease: "none",
              onUpdate: function () {
                var t = drive.t;
                var txt = CLOCK[0][1];
                for (var i = 0; i < CLOCK.length; i++) if (t >= CLOCK[i][0]) txt = CLOCK[i][1];
                if (txt !== lastClock) {
                  clockEl.textContent = txt;
                  lastClock = txt;
                }
                applySplit(t);
              },
            },
            0,
          );

          // line appears as a spark that stretches open, then rides down
          tl.fromTo(lineEl, { opacity: 0, scaleX: 0.02 }, { opacity: 1, scaleX: 1, duration: 0.22, ease: "expo.out" }, L0 - 0.12);
          tl.fromTo(lineEl, { opacity: 1 }, { opacity: 0, duration: 0.18, ease: "power1.in", immediateRender: false }, L1 - 0.04);

          /* --- camera: slow push on the shop through the lonely night, released by the line */
          var world = $("st-world");
          tl.fromTo(world, { scale: 1 }, { scale: 1.035, duration: L0 - 1.0, ease: "sine.inOut" }, 1.0);
          tl.fromTo(world, { scale: 1.035 }, { scale: 1, duration: L1 - L0, ease: "power2.inOut", immediateRender: false }, L0);

          /* --- beat 1: closing time */
          tl.fromTo("#st-sign-card", { rotationY: 0, transformPerspective: 600 }, { rotationY: 180, transformPerspective: 600, duration: 0.5, ease: "back.out(1.4)" }, cue("signFlip"));
          tl.fromTo("#st-sign-hang", { rotation: 0 }, { rotation: -9, duration: 0.18, ease: "power2.out" }, cue("signFlip"));
          tl.fromTo("#st-sign-hang", { rotation: -9 }, { rotation: 6, duration: 0.3, ease: "sine.inOut", immediateRender: false }, cue("signFlip") + 0.18);
          tl.fromTo("#st-sign-hang", { rotation: 6 }, { rotation: -3, duration: 0.3, ease: "sine.inOut", immediateRender: false }, cue("signFlip") + 0.48);
          tl.fromTo("#st-sign-hang", { rotation: -3 }, { rotation: 0, duration: 0.4, ease: "sine.out", immediateRender: false }, cue("signFlip") + 0.78);

          var off0 = cue("lightsOff", 0),
            off1 = cue("lightsOff", 1),
            off2 = cue("lightsOff", 2);
          tl.fromTo("#st-window-dark", { opacity: 0 }, { opacity: 0.94, duration: 0.07, ease: "none" }, off0);
          tl.fromTo("#st-door-glass-dark", { opacity: 0 }, { opacity: 0.94, duration: 0.07, ease: "none" }, off0);
          tl.fromTo("#st-spill", { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "none" }, off0);
          tl.fromTo("#st-lamp-glow", { opacity: 1 }, { opacity: 0, duration: 0.07, ease: "none" }, off1);
          tl.fromTo("#st-lamp-bulb", { backgroundColor: "#ffe2a8" }, { backgroundColor: "#4a3a30", duration: 0.07, ease: "none" }, off1);
          tl.fromTo(
            "#st-fascia-text",
            { color: "#f3d9a4", textShadow: "0 0 18px rgba(255,190,100,0.65)" },
            { color: "#a89474", textShadow: "0 0 0px rgba(255,190,100,0)", duration: 0.08, ease: "none" },
            off2,
          );
          // night falls on the facade
          var NF0 = cue("nightFall", 0),
            NF1 = cue("nightFall", 1);
          tl.fromTo("#st-shop-shade", { opacity: 0.06 }, { opacity: 0.5, duration: NF1 - NF0, ease: "sine.inOut" }, NF0);
          tl.fromTo("#st-moonlight", { opacity: 0 }, { opacity: 1, duration: NF1 - NF0, ease: "sine.inOut" }, NF0);

          /* --- headlines: masked line rises (waterfall), quicker exits */
          function hlIn(key, t) {
            tl.set(HLB[key], { visibility: "visible" }, t);
            HL[key].forEach(function (el, i) {
              tl.fromTo(el, { yPercent: 105 }, { yPercent: 0, duration: 0.55, ease: "power4.out" }, t + i * 0.09);
            });
          }
          function hlOut(key, t) {
            tl.set(HLB[key], { visibility: "hidden" }, t + 0.36);
            HL[key].forEach(function (el, i) {
              tl.fromTo(el, { yPercent: 0 }, { yPercent: -105, duration: 0.3, ease: "power3.in", immediateRender: false }, t + i * 0.05);
            });
          }
          ["h1", "h2", "h3", "h4", "h5"].forEach(function (k) {
            HL[k].forEach(function (el) {
              gsap.set(el, { yPercent: 105 });
            });
          });
          hlIn("h1", cue("headline1In"));
          hlOut("h1", cue("headline1Out"));
          hlIn("h2", cue("headline2In"));
          hlOut("h2", cue("headline2Swap"));
          hlIn("h3", cue("headline2Swap") + 0.12);
          hlOut("h3", cue("headline2Out"));
          hlIn("h4", cue("headline4In"));
          hlOut("h4", cue("headline4Out"));
          hlIn("h5", cue("headline5In"));
          hlOut("h5", cue("headline5Out") - 0.15);

          // clock icon: sun -> moon -> sun
          tl.fromTo("#st-clock-sun", { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "sine.inOut" }, NF0);
          tl.fromTo("#st-clock-moon", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "sine.inOut" }, NF0 + 0.2);
          tl.fromTo("#st-clock-moon", { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "sine.inOut", immediateRender: false }, cue("clock0630") - 0.3);
          tl.fromTo("#st-clock-sun", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "sine.inOut", immediateRender: false }, cue("clock0630") - 0.1);
          tl.fromTo("#st-clock", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.12);
          tl.fromTo("#st-clock-text", { scale: 1 }, { scale: 1.12, duration: 0.08, ease: "power2.out" }, cue("clockTick"));
          tl.fromTo("#st-clock-text", { scale: 1.12 }, { scale: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, cue("clockTick") + 0.08);

          /* --- beat 2: customers keep looking, then leave */
          var PL0 = cue("pingsLeave", 0),
            PL1 = cue("pingsLeave", 1);
          bubbles.forEach(function (b, i) {
            var t = cue("searchPings", i);
            tl.fromTo(b.el, { opacity: 0, scale: 0.6, y: 18 }, { opacity: 1, scale: 1, y: 0, duration: 0.42, ease: "back.out(1.7)" }, t);
            // gentle bob while they wait
            tl.fromTo(b.el, { y: 0 }, { y: -6, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, t + 0.42);
            // drift away to the competitor at the right edge (accelerating exit)
            var leave = PL0 + i * 0.12;
            tl.fromTo(
              b.el,
              { x: 0, opacity: 1 },
              { x: { left: 1000, right: 520, bottom: 760 }[b.s.side], opacity: 0, duration: PL1 - PL0 - 0.3, ease: "power2.in", immediateRender: false },
              leave,
            );
          });
          // lonely ring at the dark door
          tl.fromTo("#st-lone", { opacity: 0, scale: 0.4 }, { opacity: 0.9, scale: 1, duration: 0.2, ease: "power2.out" }, cue("lonePing"));
          tl.fromTo("#st-lone", { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.8, duration: 0.5, ease: "power2.out", immediateRender: false }, cue("lonePing") + 0.2);

          /* --- beat 3: the website comes alive */
          var WEB = cue("webOn");
          tl.fromTo("#st-webglow", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, WEB - 0.2);
          tl.fromTo("#st-w-card", { boxShadow: "0 0 0 2px rgba(255,255,255,0.5), 0 30px 90px rgba(255,180,110,0.0)" }, { boxShadow: "0 0 0 2px rgba(255,255,255,0.5), 0 30px 90px rgba(255,180,110,0.45)", duration: 0.6, ease: "power2.out" }, WEB);
          // badge: pop + breathing dot
          tl.fromTo("#st-w-badge", { scale: 0.7 }, { scale: 1, duration: 0.5, ease: "back.out(2)" }, cue("badgePulse") - 0.1);
          tl.fromTo("#st-w-badge-dot", { scale: 1, opacity: 1 }, { scale: 1.35, opacity: 0.55, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 9 }, cue("badgePulse"));
          // map pin drops in, then breathes
          tl.fromTo("#st-w-pin", { y: -40, scaleY: 1 }, { y: 0, duration: 0.45, ease: "bounce.out" }, WEB + 0.25);
          tl.fromTo("#st-w-pin", { scale: 1 }, { scale: 1.08, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 5, immediateRender: false }, WEB + 0.8);
          // hero products slow push (the shop's goods, now online)
          tl.fromTo("#st-w-hero-zoom", { scale: 1 }, { scale: 1.08, duration: 11.2 - WEB, ease: "sine.inOut" }, WEB);
          tl.fromTo("#st-w-hero-tag", { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, WEB + 0.35);

          // customers arrive at "Book now"
          var BOOK = $("st-w-book");
          pings.forEach(function (p, i) {
            var t0 = cue("pingsArrive", i) - 0.55;
            var pr = { t: 0 };
            function place() {
              var t = pr.t;
              var a = bez(p, t);
              gsap.set(p.dot, { x: a[0], y: a[1], opacity: t <= 0 || t >= 1 ? 0 : 1 });
              for (var k = 0; k < TRAIL; k++) {
                var tk = t - (k + 1) * 0.045;
                var b = bez(p, Math.max(0, tk));
                var vis = tk > 0 && t < 1 ? (1 - k / TRAIL) * 0.7 : 0;
                gsap.set(p.trail[k], { x: b[0], y: b[1], opacity: vis, scale: 1 - k * 0.1 });
              }
            }
            place();
            tl.fromTo(pr, { t: 0 }, { t: 1, duration: 0.55, ease: "power2.in", onUpdate: place, immediateRender: false }, t0);
            var hit = cue("pingsArrive", i);
            tl.fromTo(BOOK, { scale: 1 }, { scale: 0.93, duration: 0.06, ease: "power2.in", immediateRender: false }, hit);
            tl.fromTo(BOOK, { scale: 0.93 }, { scale: 1, duration: 0.24, ease: "back.out(3)", immediateRender: false }, hit + 0.06);
            tl.fromTo("#st-w-ripple", { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.45, duration: 0.32, ease: "power2.out", immediateRender: false }, hit);
          });

          /* --- beat 4: wake up to new customers */
          tl.fromTo("#st-scrim", { opacity: 0 }, { opacity: 0.55, duration: 0.5, ease: "sine.inOut" }, cue("notifications", 0) - 0.1);
          notes.forEach(function (el, i) {
            var t = cue("notifications", i);
            tl.fromTo(el, { opacity: 0, y: 40, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, t);
            tl.fromTo(el.querySelector(".st-note-icon"), { scale: 0.4 }, { scale: 1, duration: 0.4, ease: "back.out(2.4)" }, t + 0.08);
          });

          /* --- beat 5: the website card becomes the end card */
          var M0 = cue("morphToLockup", 0),
            M1 = cue("morphToLockup", 1);
          tl.fromTo("#st-notes", { opacity: 1 }, { opacity: 0, duration: 0.22, ease: "power1.in" }, M0 - 0.22);
          tl.fromTo("#st-scrim", { opacity: 0.55 }, { opacity: 0, duration: 0.22, ease: "power1.in", immediateRender: false }, M0 - 0.22);
          tl.fromTo("#st-w-content", { opacity: 1 }, { opacity: 0, duration: 0.22, ease: "power1.in" }, M0 - 0.22);
          tl.fromTo("#st-clock", { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power1.in", immediateRender: false }, M0 - 0.2);
          tl.fromTo("#st-cover", { opacity: 0 }, { opacity: 1, duration: 0.02, ease: "none" }, M0);
          tl.fromTo(
            "#st-cover",
            { clipPath: "inset(640px 140px 360px 140px round 28px)" },
            { clipPath: "inset(0px 0px 0px 0px round 0px)", duration: M1 - M0 - 0.04, ease: "expo.inOut" },
            M0 + 0.02,
          );

          window.__timelines["street"] = tl;
        })();
      </script>
    </template>
  </body>
