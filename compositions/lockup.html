<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!--
      SYRAZEN end card (film 11.9 -> 15.0, local 0 -> 3.1).
      Local 0.00-0.10: exact flat cream (#F6EFE3) so the street scene's full-frame card hands off invisibly.
      Local 0.10 (film 12.00, the sound hit): THE LINE slams across, the letters rise out of the
      baseline in its wake, the camera settles. Tagline 0.55, service line 0.90, read-hold to 3.1.
      Wordmark outlines are generated by tools/build_wordmark.py --inline (block between markers).
    -->
  </head>
  <body>
    <template id="lockup-template">
      <style>
        @font-face {
          font-family: "Archivo";
          src: url("../assets/fonts/Archivo-Variable.woff2") format("woff2");
          font-weight: 100 900;
          font-stretch: 62% 125%;
        }
        @font-face {
          font-family: "JetBrains Mono";
          src: url("../assets/fonts/JetBrainsMono-Variable.woff2") format("woff2");
          font-weight: 100 800;
        }

        #lk-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #f6efe3;
        }

        /* Warm dawn bloom behind the lockup (behind the camera group: it drifts on its own). */
        #lk-bloom {
          position: absolute;
          left: -380px;
          top: 250px;
          width: 1840px;
          height: 1400px; /* centred on the lockup (540, 950) */
          opacity: 0;
          background: radial-gradient(
            closest-side,
            rgba(242, 166, 90, 0.2) 0%,
            rgba(242, 166, 90, 0.165) 24%,
            rgba(242, 166, 90, 0.1) 50%,
            rgba(242, 166, 90, 0.038) 76%,
            rgba(242, 166, 90, 0) 100%
          );
        }

        /* Camera group: everything that settles together after the hit. */
        #lk-stage {
          position: absolute;
          inset: 0;
        }

        /* Light given off by the line (breathes during the hold). */
        #lk-glow {
          position: absolute;
          left: 60px;
          top: 880px;
          width: 960px;
          height: 96px; /* centred on the line (y 927.6) */
          opacity: 0;
          background: radial-gradient(
            closest-side,
            rgba(255, 74, 28, 0.26) 0%,
            rgba(255, 74, 28, 0.15) 40%,
            rgba(255, 74, 28, 0.05) 72%,
            rgba(255, 74, 28, 0) 100%
          );
        }

        /* Wordmark: 852 px wide, baseline at y 900 (SVG top 804.1 + 95.9). Line at y 921.3-933.9. */
        #lk-wm {
          position: absolute;
          display: block;
          left: 114px;
          top: 804.1px;
          width: 852px;
          height: 129.9px;
          overflow: visible;
        }

        #lk-tagline {
          position: absolute;
          left: 108px;
          right: 108px;
          top: 984.8px; /* baseline ~1036 */
          height: 67.6px;
          overflow: hidden; /* the words rise out of this edge */
          margin: 0;
          font-family: "Archivo", sans-serif;
          font-stretch: 112%;
          font-weight: 700;
          font-size: 52px;
          line-height: 67.6px;
          letter-spacing: -0.01em;
          color: #14161f;
          text-align: center;
          white-space: nowrap;
        }
        .lk-word {
          display: inline-block;
        }

        #lk-service {
          position: absolute;
          left: 108px;
          right: 108px;
          top: 1100.3px; /* baseline ~1130 */
          height: 39.2px;
          margin: 0;
          padding-left: 0.18em; /* balances the trailing letter-space so the line centres optically */
          font-family: "JetBrains Mono", monospace;
          font-weight: 500;
          font-size: 28px;
          line-height: 39.2px;
          letter-spacing: 0.18em;
          color: #5e5a66;
          text-align: center;
          white-space: nowrap;
          opacity: 0;
        }
      </style>

      <div id="lk-root" data-composition-id="lockup" data-width="1080" data-height="1920">
        <div id="lk-bloom" data-layout-allow-overflow></div>
        <div id="lk-stage" data-layout-allow-overflow>
          <div id="lk-glow"></div>
          <!-- @wordmark:begin (generated by tools/build_wordmark.py --inline; do not hand-edit) -->
          <svg id="lk-wm" viewBox="0 -12 6217 947.5" role="img" aria-label="SYRAZEN">
            <defs>
              <clipPath id="lk-wm-clip" clipPathUnits="userSpaceOnUse">
                <rect x="-60" y="-72" width="6337" height="772"/>
              </clipPath>
              <clipPath id="lk-wm-accent-clip" clipPathUnits="userSpaceOnUse">
                <rect x="0" y="842.5" width="6217" height="94"/>
              </clipPath>
            </defs>
            <g id="lk-wm-letters" clip-path="url(#lk-wm-clip)" fill="#14161F">
              <path id="lk-wm-S" d="M401.3 699.5Q317.3 699.5 244.4 689.5Q171.5 679.5 116.7 654.4Q61.9 629.4 30.9 584.6Q0 539.7 0 470.7Q0 468.7 0 465.5Q0 462.2 1 459.1H200.5Q199.5 463.1 199.2 467.5Q199 471.9 199 476.8Q199 507.2 222.2 524.8Q245.4 542.4 287.8 549.5Q330.2 556.6 386.3 556.6Q409.9 556.6 434.5 555.2Q459.1 553.8 482 550.1Q504.9 546.5 523.2 539.7Q541.4 532.8 552.3 522.1Q563.2 511.3 563.2 496Q563.2 474.3 540.2 461.8Q517.2 449.3 478.1 441.8Q438.9 434.2 390.2 428.3Q341.6 422.4 289.4 414.2Q237.3 405.9 188.7 391.4Q140 376.9 100.8 352.8Q61.7 328.8 38.7 290.9Q15.7 253 15.7 198.4Q15.7 143.9 43.4 104.2Q71 64.5 120.9 38.7Q170.8 12.9 238.7 0.5Q306.7 -12 386.8 -12Q468.4 -12 534.9 0.6Q601.3 13.3 649 38.7Q696.7 64.2 722.4 102.9Q748 141.5 748 193.6V207.4H550.6V199.3Q550.6 178.4 532.6 162.2Q514.5 146 480.1 136.3Q445.6 126.6 396.3 126.6Q337.3 126.6 299.4 134Q261.5 141.3 243.5 154.1Q225.5 166.9 225.5 182.1Q225.5 202.4 248.4 214.2Q271.4 226 310.6 232.9Q349.7 239.8 398.4 245.7Q447 251.6 499.2 259.8Q551.3 268 599.9 281.7Q648.6 295.4 687.8 319.2Q727 343 749.9 379.3Q772.9 415.6 772.9 468.7Q772.9 551.4 725 602.3Q677.1 653.3 593.2 676.4Q509.3 699.5 401.3 699.5Z"/>
              <path id="lk-wm-Y" d="M1150 687.5V413.3L810.2 0H1050.8L1252.1 257.1H1260.5L1463.2 0H1693.3L1353.6 413.3V687.5H1150Z"/>
              <path id="lk-wm-R" d="M1789.2 687.5V0H2361.5Q2436.6 0 2485.8 30.9Q2535.1 61.7 2559.7 112.1Q2584.3 162.5 2584.3 222.1Q2584.3 287.4 2553.4 340.9Q2522.4 394.4 2460.2 425.5L2600.8 687.5H2371.1L2257 458.8H1992.8V687.5H1789.2ZM1992.8 308.4H2295Q2331.7 308.4 2353.6 286.3Q2375.6 264.3 2375.6 227.8Q2375.6 203.1 2365.7 185.9Q2355.8 168.7 2337.9 159.8Q2319.9 150.9 2295 150.9H1992.8V308.4Z"/>
              <path id="lk-wm-A" d="M2654 687.5 2992 0H3218.4L3556.4 687.5H3336.1L3284.2 577.4H2915.2L2863.8 687.5H2654ZM2983.4 428.3H3216L3153.4 288.5Q3149.5 279.2 3142.4 262Q3135.4 244.9 3127.8 225.4Q3120.2 205.8 3113.8 189.1Q3107.4 172.3 3104.2 164.2H3096.7Q3089.4 182.6 3079.8 206.4Q3070.2 230.3 3061.3 252.6Q3052.4 275 3046 289L2983.4 428.3Z"/>
              <path id="lk-wm-Z" d="M3599.7 687.5V617L4026.6 150.9H3630.2V0H4368.4V70.1L3940.1 536.6H4375.6V687.5H3599.7Z"/>
              <path id="lk-wm-E" d="M4519.2 687.5V0H5235.9V150.9H4723.4V266.4H5172.1V412.4H4723.4V536.6H5243.9V687.5H4519.2Z"/>
              <path id="lk-wm-N" d="M5398.2 687.5V0H5580.3L5936.8 320.8Q5946 328.5 5960.2 342.6Q5974.3 356.7 5989.8 371.9Q6005.2 387 6017 399.2H6026.1Q6025.7 381.5 6025 354.4Q6024.3 327.2 6024.3 306.1V0H6217V687.5H6037.3L5689.7 373.6Q5666 352.5 5639.7 326.7Q5613.5 300.9 5597.7 285.2H5589.6Q5590 298.7 5590.5 327.4Q5590.9 356.1 5590.9 389.4V687.5H5398.2Z"/>
            </g>
            <g clip-path="url(#lk-wm-accent-clip)">
              <path id="lk-wm-accent" fill="#FF4A1C" d="M0 935.5L84.5 843.5L6217 843.5L6132.6 935.5Z"/>
            </g>
          </svg>
          <!-- @wordmark:end -->
          <p id="lk-tagline"><span class="lk-word" data-layout-allow-overflow>Get</span> <span class="lk-word" data-layout-allow-overflow>your</span> <span class="lk-word" data-layout-allow-overflow>business</span> <span class="lk-word" data-layout-allow-overflow>online.</span></p>
          <p id="lk-service">WEB DESIGN &amp; DEVELOPMENT</p>
        </div>
      </div>

      <script>
        (function () {
          var KIT = window.SYRAZEN_KIT;
          var S = window.SYRAZEN;
          var T0 = S.scenes.lockup.start; // film -> local offset (11.9)
          var END = S.scenes.lockup.end - T0; // 3.1
          var IMPACT = KIT.cue("impact", 0, T0); // 0.10, the sound hit
          var TAG = KIT.cue("taglineIn", 0, T0); // 0.55
          var SERV = KIT.cue("serviceIn", 0, T0); // 0.90

          // Copy comes from the cue contract (tools/cues.json -> assets/js/cues.js).
          var tagEl = document.getElementById("lk-tagline");
          var svcEl = document.getElementById("lk-service");
          if (S.copy && S.copy.tagline) {
            var words = S.copy.tagline.split(" ");
            tagEl.textContent = "";
            words.forEach(function (w, i) {
              var sp = document.createElement("span");
              sp.className = "lk-word";
              sp.setAttribute("data-layout-allow-overflow", ""); // masked rise: overflow is the effect
              sp.textContent = w;
              tagEl.appendChild(sp);
              if (i < words.length - 1) tagEl.appendChild(document.createTextNode(" "));
            });
          }
          if (S.copy && S.copy.service) svcEl.textContent = S.copy.service;

          var LETTERS = ["S", "Y", "R", "A", "Z", "E", "N"].map(function (c) {
            return document.getElementById("lk-wm-" + c);
          });
          var accent = document.getElementById("lk-wm-accent");
          var WM_W = parseFloat(document.getElementById("lk-wm").getAttribute("viewBox").split(" ")[2]);

          var tl = gsap.timeline({ paused: true });

          // 1. THE LINE slams across on the hit, leading with its Z-angled blade end.
          // Parked a full width + 200u to the left so not even an antialiased tip touches the clip edge.
          tl.fromTo(accent, { x: -(WM_W + 200) }, { x: 0, duration: 0.34, ease: "expo.out" }, IMPACT);

          // 2. Letters rise out of the baseline in the line's wake (mask = clipPath at the baseline).
          tl.fromTo(
            LETTERS,
            { y: 760 },
            { y: 0, duration: 0.62, ease: "expo.out", stagger: 0.034 },
            IMPACT + 0.03
          );

          // 3. Camera settle on the hit.
          tl.fromTo(
            "#lk-stage",
            { scale: 1.03, transformOrigin: "540px 950px" },
            { scale: 1, duration: 1.25, ease: "power3.out" },
            IMPACT
          );

          // 4. Light: dawn bloom lands with the mark, then drifts for the whole hold.
          tl.fromTo("#lk-bloom", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.out" }, IMPACT);
          tl.fromTo(
            "#lk-bloom",
            { scale: 0.9, transformOrigin: "50% 50%" },
            { scale: 1.06, duration: END - IMPACT, ease: "sine.out" },
            IMPACT
          );

          // Line glow: flares as the line lands, eases down, then breathes (finite, sine.inOut).
          // The glow travels with the line (same ease/duration), so there is never light ahead of it.
          tl.fromTo(
            "#lk-glow",
            { scaleX: 0.06, transformOrigin: "0% 50%" },
            { scaleX: 1, duration: 0.34, ease: "expo.out" },
            IMPACT
          );
          tl.fromTo("#lk-glow", { opacity: 0 }, { opacity: 1, duration: 0.24, ease: "power2.out" }, IMPACT + 0.02);
          tl.fromTo(
            "#lk-glow",
            { opacity: 1 },
            { opacity: 0.5, duration: 0.6, ease: "power2.inOut", immediateRender: false },
            IMPACT + 0.3
          );
          var BREATHE_START = IMPACT + 0.9;
          var HALF = 1.0;
          var reps = Math.max(0, Math.floor((END - BREATHE_START) / HALF) - 1);
          tl.fromTo(
            "#lk-glow",
            { opacity: 0.5 },
            { opacity: 0.95, duration: HALF, ease: "sine.inOut", yoyo: true, repeat: reps, immediateRender: false },
            BREATHE_START
          );

          // 5. Tagline: words rise out of their line's lower edge.
          tl.fromTo(
            "#lk-tagline .lk-word",
            { yPercent: 110 },
            { yPercent: 0, duration: 0.7, ease: "expo.out", stagger: 0.06 },
            TAG
          );

          // 6. Service line: opens from the centre outward, like the line drawing.
          tl.fromTo(
            "#lk-service",
            { opacity: 0, clipPath: "inset(0% 50% 0% 50%)" },
            { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "power3.out" },
            SERV
          );

          window.__timelines["lockup"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
