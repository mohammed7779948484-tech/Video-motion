      <script>
        (function () {
          var S = window.SYRAZEN, KIT = window.SYRAZEN_KIT, C = S.cues, GEO = S.geometry;
          var END = S.scenes.environment.end - S.scenes.environment.start; // 12 s — this scene starts at 0, so local time == film time
          var NF0 = C.nightFall[0], NF1 = C.nightFall[1], SR0 = C.sunrise[0], SR1 = C.sunrise[1], SVGNS = "http://www.w3.org/2000/svg";
          function byId(id) { return document.getElementById(id); }
          function el(p, cls, css) { var d = document.createElement("div"); d.className = cls || ""; if (css) d.style.cssText = css; p.appendChild(d); return d; }
          function box(p, x, y, w, h, bg, extra) { return el(p, "env-box", "left:" + x + "px;top:" + y + "px;width:" + w + "px;height:" + h + "px;background:" + bg + ";" + (extra || "")); }
          function boxes(p, list) { list.forEach(function (b) { box.apply(null, [p].concat(b)); }); }
          function svg(p, tag, a) { var n = document.createElementNS(SVGNS, tag); for (var k in a) n.setAttribute(k, a[k]); p.appendChild(n); return n; }

          // One paused timeline, fromTo only, absolute (film) times. The first tween per element+property renders
          // immediately (that is the t=0 state); every later one has immediateRender:false, so seeking is order-independent.
          var tl = gsap.timeline({ paused: true }), seen = new Map(), NONPROP = { duration: 1, ease: 1, yoyo: 1, repeat: 1, onUpdate: 1, immediateRender: 1, transformOrigin: 1 };
          function T(t, from, to, at) {
            var rec = seen.get(t) || {}, fresh = true;
            for (var k in to) if (!NONPROP[k]) { if (rec[k]) fresh = false; rec[k] = 1; }
            seen.set(t, rec); if (!("immediateRender" in to)) to.immediateRender = fresh; if (!to.ease) to.ease = "sine.inOut";
            tl.fromTo(t, from, to, at);

          function fade(t, a, b, dur, at, ease) { T(t, { opacity: a }, { opacity: b, duration: dur, ease: ease }, at); }
          // finite yoyo "breath": an even number of half-cycles, so it always lands back on `from` before `until`

            var n = Math.floor((until - start) / (2 * half));

          }

          // ── 1. SKY: dusk glow sinks and fades with nightfall; dawn sky + horizon glow bloom at sunrise
          var dusk = byId("env-sky-dusk");
          T(dusk, { y: 0 }, { y: 34, duration: NF1 + 0.2, ease: "power1.in" }, 0);
          fade(dusk, 1, 0, NF1 - NF0 + 0.2, NF0);
          fade(byId("env-sky-dawn"), 0, 1, SR1 - SR0, SR0);
          T(byId("env-sky-dawnglow"), { opacity: 0, scaleX: 0.8 }, { opacity: 1, scaleX: 1, duration: SR1 - SR0 + 0.3, ease: "power1.out", transformOrigin: "810px 680px" }, SR0 + 0.1);
          (function () { // sky-only grain: seeded noise tile, offset stepped at 12 fps from a seeded table
            var g = byId("env-grain"), cv = document.createElement("canvas"), gr = KIT.rng(91371), orng = KIT.rng(4410);
            cv.width = cv.height = 256;
            var cx = cv.getContext("2d"), img = cx.createImageData(256, 256), steps = Math.round(END * 12), offs = [], proxy = { p: 0 };
            for (var i = 0, v, c; i < 65536; i++) { // light specks dimmer than dark ones: grain never lifts the headline sky
              v = gr(); c = v > 0.5 ? 255 : 0; img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = c; img.data[i * 4 + 3] = Math.round(Math.abs(v - 0.5) * 2 * (c ? 22 : 40));

            for (var s = 0; s <= steps; s++) offs.push(Math.floor(orng() * 256) + "px " + Math.floor(orng() * 256) + "px");
            g.style.backgroundPosition = offs[0];
            T(proxy, { p: 0 }, { p: steps, duration: END, ease: "none", onUpdate: function () { g.style.backgroundPosition = offs[Math.min(steps, Math.max(0, Math.floor(proxy.p)))]; } }, 0);
          })();

          // ── 2. STARS: ~40 seeded, fade in highest-first during nightfall, a third twinkle (finite), out at sunrise
          (function () {
            var layer = byId("env-stars"), r = KIT.rng(20261011), m = GEO.moon, hz = GEO.headlineZone, n = 0, guard = 0;
            while (n < 42 && guard++ < 4000) {
              var x = 24 + r() * 1032, y = 120 + r() * 500, sz = 1.5 + r() * 1.5, base = 0.4 + r() * 0.5, tw = r(), ph = r();
              if (Math.hypot(x - m.cx, y - m.cy) < 95 || (x < 150 && y > 300) || (x > 930 && y > 390)) continue;
              if (x > hz.x && x < hz.x + hz.w && y > hz.y - 10 && y < hz.y + hz.h + 10) base *= 0.7;
              var d = el(layer, "env-star", "left:" + (x - sz / 2).toFixed(1) + "px;top:" + (y - sz / 2).toFixed(1) + "px;width:" + sz.toFixed(2) + "px;height:" + sz.toFixed(2) + "px;opacity:0");
              fade(d, 0, base, 0.6, NF0 + 0.25 + ((y - 120) / 500) * 0.95 + ph * 0.3, "power1.out");
              if (n++ % 3 === 0) breathe(d, { opacity: base }, { opacity: base * 0.22 }, 2.8 + ph * 0.9, SR0 - 0.2, 0.55 + tw * 0.5);
            }
            [[236, 140, 0.9], [748, 148, 1.15], [430, 252, 0.75]].forEach(function (p, i) {
              var w = el(layer, "env-sparkle", "left:" + (p[0] - 9) + "px;top:" + (p[1] - 9) + "px;opacity:0");
              el(w, "env-sparkle-bar"); el(w, "env-sparkle-bar env-rot"); el(w, "env-star", "left:7px;top:7px;width:4px;height:4px;opacity:0.95");
              fade(w, 0, 1, 0.7, NF0 + 0.5 + i * 0.35, "power1.out");
              breathe(w, { scale: 1, rotation: 0 }, { scale: 0.45, rotation: 25 }, 2.7 + i * 0.4, SR0 - 0.2, p[2]);
