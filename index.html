<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>SYRAZEN — Open All Night (15s, 9:16)</title>
    <!-- Vendored locally: renders must never depend on a CDN or live network. -->
    <script src="assets/js/vendor/gsap.min.js"></script>
    <script src="assets/js/cues.js"></script>
    <script src="assets/js/kit.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: #0b0e18;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0e18;
      }
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1080"
      data-height="1920"
    >
      <!-- World: sky, moon, sun, neighbouring buildings, street. -->
      <div
        id="el-environment"
        data-composition-id="environment"
        data-composition-src="compositions/environment.html"
        data-start="0"
        data-duration="12"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- The physical shopfront: closes at 6, goes dark (below the line). -->
      <div
        id="el-shop"
        data-composition-id="shop"
        data-composition-src="compositions/shop.html"
        data-start="0"
        data-duration="12"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- The shop's website: drawn by the line, catches customers, becomes the end card. -->
      <div
        id="el-website"
        data-composition-id="website"
        data-composition-src="compositions/website.html"
        data-start="0"
        data-duration="12"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Copy layer: clock, headlines, customers searching at night. -->
      <div
        id="el-story"
        data-composition-id="story"
        data-composition-src="compositions/story.html"
        data-start="0"
        data-duration="12"
        data-track-index="4"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Brand payoff: SYRAZEN end card. -->
      <div
        id="el-lockup"
        data-composition-id="lockup"
        data-composition-src="compositions/lockup.html"
        data-start="11.9"
        data-duration="3.1"
        data-track-index="5"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Original procedural score + sound design (tools/build_audio.py). -->
      <audio
        id="score"
        src="assets/audio/syrazen-score.wav"
        data-start="0"
        data-duration="15"
        data-track-index="10"
        data-volume="1"
      ></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
